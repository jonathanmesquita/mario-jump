<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./css/style.css">

    <!-- Classic scripts (not ES modules) so the game still runs by opening
         index.html directly from disk. Order matters: each file only uses
         what the files above it define. -->
    <script src="./js/config.js" defer></script>
    <script src="./js/input.js" defer></script>
    <script src="./js/sprite.js" defer></script>
    <script src="./js/player.js" defer></script>
    <script src="./js/obstacles.js" defer></script>
    <script src="./js/collision.js" defer></script>
    <script src="./js/scenes.js" defer></script>
    <script src="./js/game.js" defer></script>

    <title>Arriba Jump</title>
</head>
<body>

    <div class="game-board">
        <canvas class="game-canvas" aria-label="Jogo Arriba Jump"></canvas>

        <div class="hud">
            <span class="lives" aria-label="Vidas"></span>
            Pontos: <span class="score">0</span>
            &middot; Recorde: <span class="best">0</span>
        </div>

        <div class="scene-name"></div>
        <div class="message" role="status"></div>

        <!-- Main menu -->
        <div class="screen screen-menu" hidden>
            <h1>Arriba Jump</h1>
            <p>Recorde: <span class="menu-best">0</span></p>
            <button type="button" class="btn btn-play">Jogar</button>
            <p class="hint">Espaço, ↑ ou toque para pular.<br>Segure para pular mais alto.</p>
        </div>

        <!-- Game over -->
        <div class="screen screen-gameover" hidden>
            <h2>GAME OVER</h2>
            <p class="stats">
                Pontos: <span class="final-score">0</span>
                &middot; Recorde: <span class="final-best">0</span><br>
                Tempo: <span class="final-time">0</span>s
                &middot; Chegou até: <span class="final-place"></span>
            </p>
            <p class="new-record" hidden>Novo recorde!</p>
            <div class="buttons">
                <button type="button" class="btn btn-retry">Tentar novamente</button>
                <button type="button" class="btn btn-menu">Menu principal</button>
            </div>
            <p class="hint">Espaço = tentar novamente &middot; Esc = menu</p>
        </div>
    </div>

</body>
</html>
